{% extends "base.html" %}

{% block content %}
  <div class="panel p-4 p-md-5 form-section" style="max-width: 760px; background: rgba(22, 33, 64, 0.96);">
    <h1 class="h4 fw-semibold mb-2 text-center">Вход в систему</h1>
    <p class="text-muted-soft text-center mb-4">Войдите как заказчик или исполнитель</p>

    <form id="login-form" class="row g-3">
      <div class="col-12">
        <label class="form-label text-muted-soft small">Username</label>
        <input name="username" class="form-control" required>
      </div>
      <div class="col-12">
        <label class="form-label text-muted-soft small">Пароль</label>
        <input name="password" type="password" class="form-control" required>
      </div>
      <div class="col-12 d-flex gap-2 justify-content-center mt-2">
        <button class="btn btn-accent px-4" type="submit">Войти</button>
      </div>
      <div class="col-12 text-center">
        <a href="{% url 'register-page' %}" class="btn btn-link text-decoration-none">Нет аккаунта? Зарегистрироваться</a>
      </div>
      <div class="col-12">
        <div id="login-status" class="small-kbd text-center"></div>
      </div>
    </form>
  </div>
{% endblock %}

{% block scripts %}
  <script>
    const form = document.getElementById("login-form");
    const statusEl = document.getElementById("login-status");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.textContent = "Авторизация...";
      const body = Object.fromEntries(new FormData(form).entries());
      try {
        const r = await fetch("/api/auth/login/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await r.json();
        if (!r.ok) {
          statusEl.textContent = "Ошибка входа: " + JSON.stringify(data);
          return;
        }
        window.ocAuth.ocSetTokens(data.access, data.refresh);
        window.ocAuth.syncAuthNav();
        window.location.href = "{% url 'cabinet-page' %}";
      } catch (err) {
        statusEl.textContent = "Сеть недоступна";
      }
    });
  </script>
{% endblock %}
