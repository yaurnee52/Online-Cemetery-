{% extends "base.html" %}

{% block content %}
  <div class="panel p-4 p-md-5">
    <!-- Header -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div>
        <h1 class="h4 fw-semibold mb-2">Карта кладбищ Москвы</h1>
        <p class="text-muted-soft mb-0">Поиск кладбища и переход к карточке</p>
      </div>
      <a class="btn btn-outline-light btn-sm" href="{% url 'index' %}">← На главную</a>
    </div>

    <!-- Cemetery Search -->
    <div class="panel p-4 search-block search-block-primary mb-4">
      <div class="row g-3">
        <div class="col-12 col-lg-8">
          <label class="form-label text-muted-soft small">Поиск кладбища</label>
          <select id="map-cemetery-search" placeholder="Начните вводить..." autocomplete="off">
            <option value="">Выберите кладбище...</option>
          </select>
        </div>
        <div class="col-12 col-lg-4 d-flex align-items-end gap-2">
          <button id="map-focus-cemetery" class="btn btn-accent w-100" type="button">Показать на карте</button>
          <button id="map-open-cemetery" class="btn btn-outline-light w-100" type="button">Открыть карточку</button>
        </div>
      </div>
    </div>

    <!-- Map Container -->
    <div id="map" style="height: 70vh; border-radius: 1rem; overflow: hidden; border: 1px solid var(--panel-border); box-shadow: 0 8px 24px rgba(8,12,28,.2);"></div>

    <!-- Info -->
    <div class="mt-4 text-muted-soft small">
      <p class="mb-0">На карте отображены кладбища Москвы. Выберите кладбище в поле поиска или нажмите на маркер.</p>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <script src="https://maps.api.2gis.ru/2.0/loader.js?pkg=full&key=c5e4d7ec-f9d0-470f-b7f0-278f622f20e2"></script>
  <script>
    const cemeteryMarkers = {{ markers_json|safe }};
    const focusPoint = {{ focus_point_json|safe }};
    
    let mapInstance = null;
    const markerById = new Map();

    if (typeof DG !== 'undefined') {
      DG.then(function () {
        try {
          mapInstance = DG.map('map', {
            center: [55.7558, 37.6173],
            zoom: 10
          });
          if (Array.isArray(cemeteryMarkers) && cemeteryMarkers.length > 0) {
            cemeteryMarkers.forEach((item) => {
              if (item.lat != null && item.lon != null) {
                const marker = DG.marker([item.lat, item.lon]).addTo(mapInstance);
                marker.bindPopup(
                  "<strong>" + item.name + "</strong><br><a href='/cemetery/" + item.id + "/'>Открыть карточку</a>"
                );
                markerById.set(String(item.id), marker);
              }
            });
          }
          if (focusPoint && focusPoint.lat != null && focusPoint.lon != null) {
            mapInstance.setView([focusPoint.lat, focusPoint.lon], 16);
            const graveMarker = DG.marker([focusPoint.lat, focusPoint.lon]).addTo(mapInstance);
            const label = focusPoint.label || "Место захоронения";
            graveMarker.bindPopup("<strong>" + label + "</strong><br>Точная точка могилы");
            graveMarker.openPopup();
          }
        } catch (mapErr) {
          console.error('Map initialization error:', mapErr);
        }
      });
    } else {
      console.error('DG API library not loaded');
    }
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const selectEl = document.getElementById("map-cemetery-search");
      const focusBtn = document.getElementById("map-focus-cemetery");
      const openBtn = document.getElementById("map-open-cemetery");
      if (!selectEl) return;

      const options = cemeteryMarkers
        .slice()
        .sort((a, b) => (a.name || "").localeCompare(b.name || "", "ru"))
        .map((item) => ({ value: String(item.id), text: item.name || `Кладбище #${item.id}` }));

      const ts = new TomSelect(selectEl, {
        create: false,
        options,
        sortField: { field: "text", direction: "asc" },
        maxOptions: 1000,
        allowEmptyOption: true
      });

      focusBtn?.addEventListener("click", () => {
        const value = ts.getValue();
        if (!value) return;
        const marker = markerById.get(String(value));
        if (!marker || !mapInstance) return;
        const latLng = marker.getLatLng();
        mapInstance.setView([latLng.lat, latLng.lng], 14);
        marker.openPopup();
      });

      openBtn?.addEventListener("click", () => {
        const value = ts.getValue();
        if (!value) {
          alert("Пожалуйста, выберите кладбище");
          return;
        }
        window.location.href = "/cemetery/" + value + "/";
      });
    });
  </script>
{% endblock %}
